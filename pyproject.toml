[project]
name = "pandas-ta"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pandas_ta"]

dependencies = [
    "numba>=0.59.0",
    "numpy>=1.26.4",
    "pandas>=2.2.0",
    "pandas-datareader>=0.10.0",
    "scipy>=1.12",
]

[project.optional-dependencies]
full = [
    "alphavantage-api",
    "matplotlib>=3.10.3",
    "mplfinance>=0.12.10b0",
    # todo change to scikit-learn
    "sklearn",
    "statsmodels>=0.14.5",
    "stochastic>=0.4.0",
    "ta-lib>=0.6.4",
    "tqdm>=4.67.1",
    "vectorbt>=0.28.0",
    "yfinance>=0.2.65",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.12.2",
    "ta-lib>=0.6.4",
    "yfinance>=0.2.65",
]

[tool.ruff.lint]
ignore = ["E402", "F403", "F841", "F405"]
#select = ["NPY201"]
